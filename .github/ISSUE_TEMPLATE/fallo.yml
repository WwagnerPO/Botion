name: Avisar de un fallo
description: Algo no funciona como debería.
title: "[Fallo] "
labels: ["fallo"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. Cuanto más concreto, antes se arregla.
  - type: textarea
    id: que
    attributes:
      label: Qué pasa
      description: Qué ha fallado y qué esperabas que pasara.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para que vuelva a pasar
      placeholder: |
        1. Abro una nota…
        2. Escribo /tabla…
        3. …
    validations:
      required: true
  - type: textarea
    id: info
    attributes:
      label: Información para soporte
      description: En Botion, abre «Acerca de» (icono ⓘ abajo en la barra lateral) → «Copiar información para soporte» y pégalo aquí.
      render: text
    validations:
      required: true
  - type: textarea
    id: capturas
    attributes:
      label: Capturas o vídeo (opcional)
      description: Arrastra aquí imágenes. No incluyas notas privadas.
